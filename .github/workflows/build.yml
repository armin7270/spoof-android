name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # The build shells out to `python` for the two AAR patch tasks
      # (isolatePsiphonAar / patchV2raySeqAar). Ubuntu runners only ship
      # python3, so provide the bare name.
      - name: Ensure python command exists
        run: sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Release build signs with the repo keystore (via keystore.properties
      # contents injected as one secret) or stays unsigned when absent.
      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: SNI-Spoofing-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: SNI-Spoofing-release-apks
          # signed when keystore.properties secrets exist, unsigned otherwise
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
